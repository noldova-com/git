name: Build and test

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    name: Build and test
    uses: noldova-com/.github/.github/workflows/build-and-test.yml@43df1a5296a892a1ed162a02ca2af77902d19bb8 # v2.51.2
    permissions:
      contents: read
      packages: read
    with:
      targets: ${{ github.event_name != 'pull_request' && 'linux-x64 linux-arm64 windows-x64 windows-arm64 macos-x64 macos-arm64' || 'linux-x64 windows-x64 macos-arm64' }}
      publishes: true
      timeout-minutes: 17
      shards: ${{ github.event_name != 'pull_request' && 'windows-arm64=3 macos-x64=2' || '' }}
      shard-outputs: ${{ github.event_name != 'pull_request' && '_build/vitest-blob' || '' }}
