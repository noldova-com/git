name: Module range

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  git:
    name: Module range / Git
    uses: noldova-com/desktop/.github/workflows/module-range.yml@4a952ab785ad808de592e9428c3feff7dc979e8f # v0.0.2
    permissions:
      contents: read
      issues: write
    with:
      module: src/noldova.git

  github:
    name: Module range / GitHub
    uses: noldova-com/desktop/.github/workflows/module-range.yml@4a952ab785ad808de592e9428c3feff7dc979e8f # v0.0.2
    permissions:
      contents: read
      issues: write
    with:
      module: src/noldova.git.github
