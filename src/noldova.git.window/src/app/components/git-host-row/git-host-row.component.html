@if (row(); as row) {
  <ng-container *ngComponentOutlet="row.component; inputs: inputs(); injector: row.injector" />
} @else {
  <div class="plain">
    <span class="material-symbols-rounded" aria-hidden="true">{{ resources.plainRemoteIcon }}</span>
    <span class="plain-text">{{ plainLine() }}</span>
  </div>
}
