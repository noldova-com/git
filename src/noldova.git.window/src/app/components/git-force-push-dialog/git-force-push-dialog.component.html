<nol-dialog [title]="resources.forcePushTitle" (dismissed)="answered.emit(false)">
  <p class="text">{{ text() }}</p>
  <button nol-button nolDialogAction type="button" class="force" (click)="answered.emit(true)">{{ resources.forcePushLabel }}</button>
  <button nol-button nolDialogAction type="button" class="cancel" [variant]="secondary" (click)="answered.emit(false)">{{ resources.cancelLabel }}</button>
</nol-dialog>
