<nol-dialog [title]="resources.discardTitle" (dismissed)="answered.emit(false)">
  <p class="text">{{ untracked() ? resources.formatDiscardUntracked(path(), undoable()) : resources.formatDiscardTracked(path(), undoable()) }}</p>
  <button nol-button nolDialogAction type="button" class="discard" (click)="answered.emit(true)">{{ resources.discardLabel }}</button>
  <button nol-button nolDialogAction type="button" class="cancel" [variant]="secondary" (click)="answered.emit(false)">{{ resources.cancelLabel }}</button>
</nol-dialog>
