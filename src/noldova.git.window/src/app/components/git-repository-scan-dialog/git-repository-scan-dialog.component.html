<nol-dialog [title]="title()" (dismissed)="answered.emit(null)">
  @if (cut(); as text) {
    <p class="cut">{{ text }}</p>
  }
  <p class="text">{{ resources.scanText }}</p>
  <div class="all-row"><nol-checkbox class="all" [checked]="isAllTicked()" (checkedChange)="tickAll($event)">{{ resources.tickAllLabel }}</nol-checkbox></div>
  <ul class="repositories">
    @for (repository of repositories(); track repository) {
      <li [title]="repository">
        <nol-checkbox class="repository" [checked]="!unticked().has(repository)" (checkedChange)="tick(repository, $event)">
          <span class="label"><span class="name">{{ nameOf(repository) }}</span>@if (placeOf(repository); as place) {<span class="place">{{ place }}</span>}</span>
        </nol-checkbox>
      </li>
    }
  </ul>
  <button nol-button nolDialogAction type="button" class="open" [disabled]="ticked().length === 0" (click)="answered.emit(ticked())">{{ resources.openLabel }}</button>
  <button nol-button nolDialogAction type="button" class="cancel" [variant]="secondary" (click)="answered.emit(null)">{{ resources.cancelLabel }}</button>
</nol-dialog>
