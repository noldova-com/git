<nol-dialog [title]="title()" (dismissed)="answered.emit(null)">
  <p class="text">{{ resources.scanText }}</p>
  <ul class="repositories">
    @for (repository of repositories(); track repository) {
      <li [title]="repository">
        <nol-checkbox class="repository" [checked]="!unticked().has(repository)" (checkedChange)="tick(repository, $event)">{{ labelOf(repository) }}</nol-checkbox>
      </li>
    }
  </ul>
  <button nol-button nolDialogAction type="button" class="open" [disabled]="ticked().length === 0" (click)="answered.emit(ticked())">{{ resources.openLabel }}</button>
  <button nol-button nolDialogAction type="button" class="cancel" [variant]="secondary" (click)="answered.emit(null)">{{ resources.cancelLabel }}</button>
</nol-dialog>
