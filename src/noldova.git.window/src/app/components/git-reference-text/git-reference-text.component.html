@for (part of parts(); track $index) {
  @if (part.url; as url) {
    @if (chipOf(part); as reference) {
      <a nol-link-reference-chip [reference]="reference" [href]="url" [attr.tabindex]="chipTabIndex()" (click)="activate($event, url)" (linkActivate)="open($event)"></a>
      @if (reference.workItemState; as state) {{{ ' ' }}<nol-link-reference-work-item-state [state]="state" />}
    }
    @else {
      <a class="reference" [class.linked]="link() !== null" [href]="url" [attr.tabindex]="chipTabIndex()" (click)="activate($event, url)">{{ part.reference?.()?.reference ?? part.text }}</a>
    }
  } @else {
    <span>{{ part.text }}</span>
  }
}
