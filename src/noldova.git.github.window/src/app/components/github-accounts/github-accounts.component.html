@for (account of shown(); track account) {
  <nol-git-github-sign-in [account]="account" [opensCode]="account === added()" />
}
@if (failure(); as failure) {
  <div class="nol-git-github-setting">
    <div class="nol-git-github-banner" role="alert">
      <span class="material-symbols-rounded nol-git-github-banner-icon" aria-hidden="true">{{ resources.failureIcon }}</span>
      <span class="nol-git-github-banner-text">
        <span class="nol-git-github-strong">{{ failure }}</span>
        <span class="nol-git-github-muted">{{ resources.requestFailedHint }}</span>
      </span>
    </div>
  </div>
}
@if (canAdd()) {
  <div class="nol-git-github-setting">
    <div class="nol-git-github-row">
      <button type="button" nol-button [variant]="secondary" [disabled]="isBusy()" (click)="addAsync()">
        <span class="material-symbols-rounded" nolButtonIcon aria-hidden="true">{{ resources.addAccountIcon }}</span>{{ resources.addAccount }}
      </button>
    </div>
  </div>
}
