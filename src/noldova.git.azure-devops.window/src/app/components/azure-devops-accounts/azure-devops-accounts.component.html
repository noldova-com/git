@for (account of shown(); track account) {
  <nol-git-azure-devops-sign-in [account]="account" [opensBrowser]="account === added()" />
}
@if (isAdding()) {
  <nol-git-azure-devops-sign-in [adds]="true" (added)="noteAdded($event)" (closed)="isAdding.set(false)" />
} @else if (canAdd()) {
  <div class="nol-git-azure-devops-setting">
    <div class="nol-git-azure-devops-row">
      <button type="button" nol-button [variant]="secondary" (click)="isAdding.set(true)">
        <span class="material-symbols-rounded" nolButtonIcon aria-hidden="true">{{ resources.addAccountIcon }}</span>{{ resources.addAccount }}
      </button>
    </div>
  </div>
}
